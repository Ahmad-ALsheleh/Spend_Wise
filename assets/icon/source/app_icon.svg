<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19B5B2"/>
      <stop offset="0.5" stop-color="#00808A"/>
      <stop offset="1" stop-color="#004A53"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="0.35" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#FFEBB0"/>
      <stop offset="0.55" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#E08E00"/>
    </radialGradient>
    <radialGradient id="mint" cx="0.35" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#F0FEFF"/>
      <stop offset="0.55" stop-color="#9BEAF5"/>
      <stop offset="1" stop-color="#4FC3D3"/>
    </radialGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8F0F3"/>
    </linearGradient>
    <clipPath id="walletClip">
      <rect x="-280" y="-6" width="560" height="250" rx="68"/>
    </clipPath>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#00313A" flood-opacity="0.38"/>
    </filter>
    <filter id="coinShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00313A" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g transform="translate(500 538) scale(1.1)">
    <!-- Syrian pound coin (back, right) -->
    <g filter="url(#coinShadow)">
      <circle cx="122" cy="-140" r="148" fill="url(#mint)"/>
      <circle cx="122" cy="-140" r="122" fill="none" stroke="#00626E" stroke-opacity="0.20" stroke-width="10"/>
      <text x="128" y="-134" font-family="Segoe UI" font-weight="800" font-size="98"
            fill="#00626E" text-anchor="middle" dominant-baseline="central">ل.س</text>
    </g>
    <!-- Dollar coin (front, left) -->
    <g filter="url(#coinShadow)">
      <circle cx="-112" cy="-96" r="148" fill="url(#gold)"/>
      <circle cx="-112" cy="-96" r="122" fill="none" stroke="#8A5200" stroke-opacity="0.22" stroke-width="10"/>
      <text x="-112" y="-100" font-family="Segoe UI" font-weight="900" font-size="190"
            fill="#00535B" text-anchor="middle" dominant-baseline="central">$</text>
    </g>
    <!-- Wallet -->
    <g filter="url(#shadow)">
      <rect x="-280" y="-6" width="560" height="250" rx="68" fill="url(#wallet)"/>
      <g clip-path="url(#walletClip)">
        <rect x="-280" y="-6" width="560" height="58" fill="#C9EBF0"/>
      </g>
      <rect x="146" y="80" width="160" height="110" rx="42" fill="#96E8F4"/>
      <circle cx="200" cy="135" r="20" fill="#00626E"/>
    </g>
  </g>
</svg>
